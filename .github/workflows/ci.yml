name: CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]

env:
  PYTHON_VERSION: '3.11'

jobs:
  # 单元测试
  test:
    name: 运行单元测试
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: 运行测试
        run: |
          python tests/test_core.py

  # 代码语法检查
  lint:
    name: 代码语法检查
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 编译检查所有 Python 文件
        run: |
          $files = Get-ChildItem -Path src -Filter *.py -Recurse
          $failed = @()
          foreach ($file in $files) {
            python -m py_compile $file.FullName
            if ($LASTEXITCODE -ne 0) {
              $failed += $file.FullName
            }
          }
          if ($failed.Count -gt 0) {
            Write-Host "以下文件语法错误:"
            $failed | ForEach-Object { Write-Host $_ }
            exit 1
          }
          Write-Host "所有 $($files.Count) 个 Python 文件语法检查通过"

  # 构建 EXE
  build:
    name: 构建 Windows EXE
    runs-on: windows-latest
    needs: [ test, lint ]
    if: github.event_name == 'push' || github.event_name == 'release'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: 构建 EXE
        run: |
          if (Test-Path "woldvein_trainer.spec") {
            python -m PyInstaller --noconfirm --clean woldvein_trainer.spec
          } else {
            python -m PyInstaller --noconfirm --onefile --windowed --name woldvein_trainer trainer_ui_tk.py
          }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: woldvein_trainer_exe
          path: dist/
          retention-days: 7

  # 编译 DLL
  build_dll:
    name: 编译 DLL
    runs-on: windows-latest
    needs: [ test, lint ]
    if: github.event_name == 'push' || github.event_name == 'release'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: 编译 DLL
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if not exist dist mkdir dist
          cl /LD /O2 /W3 /Fe:dist\woldvein_trainer.dll src\injector\trainer.c /link /SUBSYSTEM:WINDOWS user32.lib kernel32.lib
          del trainer.obj

      - name: 上传 DLL
        uses: actions/upload-artifact@v4
        with:
          name: woldvein_trainer_dll
          path: dist/*.dll
          retention-days: 7

  # 发布 Release
  release:
    name: 发布 Release
    runs-on: windows-latest
    needs: [ build, build_dll ]
    if: github.event_name == 'release'
    steps:
      - name: 下载 EXE
        uses: actions/download-artifact@v4
        with:
          name: woldvein_trainer_exe
          path: release/

      - name: 下载 DLL
        uses: actions/download-artifact@v4
        with:
          name: woldvein_trainer_dll
          path: release/

      - name: 打包 Release
        run: |
          $version = ${{ github.ref_name }}
          $zipName = "woldvein_trainer_$version.zip"
          Compress-Archive -Path release/* -DestinationPath $zipName
          echo "ZIP_FILE=$zipName" >> $env:GITHUB_ENV

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP_FILE }}
            release/*.exe
            release/*.dll
